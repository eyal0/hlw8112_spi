# T1-U-HL (BK7238) with the HLW8112 on the chip's SPI pins.
# Same wiring and component setup as t1-u-hl.yaml, plus a current threshold.
#
# no_load_current is the cutoff in amps. Set it just above the current shown
# with the load off. A channel's current and power publish as 0 while that
# channel's current is below it. Apparent power and power factor do the same
# for the shared channel. Voltage, frequency, and the energy totals are
# unchanged. Idle counts still accumulate, because energy is added from the
# chip registers before filters run. Use the apparent-power filter on
# phase_angle too if you add that sensor.
#
# SCK P14, MOSI P16, and MISO P17 are owned by the SPI controller.
# SCSN is module pin 19, which is P21 on this module (GPIO9 on the older CBU).
#
# Some of these meter boards tie digital ground to mains. Treat every pin as live.

substitutions:
  # Amps. Set this just above the current shown with the load off.
  no_load_current: "0.02"

esphome:
  name: hlw8112-meter

bk72xx:
  board: t1-u

external_components:
  - source:
      type: local
      path: ../bk72xx_spi/components
    components: [bk72xx_spi]
  - source:
      type: local
      path: components
    components: [hlw8112_spi]

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

bk72xx_spi:
  id: spi_bus

sensor:
  - platform: hlw8112_spi
    id: meter
    spi_id: spi_bus
    cs_pin: P21
    update_interval: 2s
    # K1 / K2 from the HLW8112 calibration-free formulas. These match the
    # clamp-meter ratios used by the OpenBeken driver. Raise a current ratio
    # if that channel reads high.
    current_ratio_a: 0.2
    current_ratio_b: 0.2
    voltage_ratio: 1.0
    # A or B fixes the shared channel. A name makes it a Home Assistant control.
    meter_channel:
      name: Meter Channel

    voltage:
      name: Voltage
    frequency:
      name: Frequency
    # Current is published before power, apparent power, and power factor, so
    # those filters see this update's current. Apparent power and power factor
    # follow id(meter).is_channel_b(), which is already set when the channel changes.
    current_a:
      name: Current A
      id: current_a
      filters:
        - lambda: |-
            return (!std::isnan(x) && std::fabs(x) < ${no_load_current}) ? 0.0f : x;
    current_b:
      name: Current B
      id: current_b
      filters:
        - lambda: |-
            return (!std::isnan(x) && std::fabs(x) < ${no_load_current}) ? 0.0f : x;
    power_a:
      name: Power A
      filters:
        - lambda: |-
            const float amps = id(current_a).state;
            return (!std::isnan(x) && !std::isnan(amps) && std::fabs(amps) < ${no_load_current}) ? 0.0f : x;
    power_b:
      name: Power B
      filters:
        - lambda: |-
            const float amps = id(current_b).state;
            return (!std::isnan(x) && !std::isnan(amps) && std::fabs(amps) < ${no_load_current}) ? 0.0f : x;
    # Volt-amps for the shared channel only. The chip has one apparent-power
    # register, so this follows Meter Channel. Power factor uses that same channel.
    apparent_power:
      name: Apparent Power
      filters:
        - lambda: |-
            const float amps = id(meter).is_channel_b() ? id(current_b).state : id(current_a).state;
            return (!std::isnan(x) && !std::isnan(amps) && std::fabs(amps) < ${no_load_current}) ? 0.0f : x;
    power_factor:
      name: Power Factor
      filters:
        - lambda: |-
            const float amps = id(meter).is_channel_b() ? id(current_b).state : id(current_a).state;
            return (!std::isnan(x) && !std::isnan(amps) && std::fabs(amps) < ${no_load_current}) ? 0.0f : x;
    energy_a:
      name: Energy A
    energy_b:
      name: Energy B

button:
  - platform: template
    name: Reset energy A
    on_press:
      then:
        - lambda: id(meter).reset_energy_a();
  - platform: template
    name: Reset energy B
    on_press:
      then:
        - lambda: id(meter).reset_energy_b();
